<header>
    <!-- BANNER (janela de vidro sem barra de título) -->
    <div class="window glass active header-window">
        <div class="banner">
            <!-- PROFILE PICTURE & STATUS BALLOON -->
            <div class="pfp">
                <img src="images/coraline.png" alt="Profile" class="pfp-img">
                <div class="status-balloon" id="music-balloon" title="Click to change!">
                    <img src="images/icons/note_icon.png" id="emoji-img" alt="emoji">
                </div>
            </div>
        </div>
    </div>

    <!-- TAGS BAR (pílula de vidro por cima da borda do banner) -->
    <div class="tags-bar">
        <div class="tag-item">
            <img src="images/icons/sparkles_icon.gif" alt="icon">
            Miku is hiding in your wifi!
        </div>
    </div>

    <!-- FLOATING LOGO -->
    <div class="logo-container">
        <img
            src="images/anilogo.gif"
            alt="Guides's Sanctuary"
            class="interactive-logo"
            id="main-logo">
    </div>
</header>
