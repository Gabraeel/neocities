<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Gallery | Guides's Sanctuary</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/gif" href="images/icons/star_icon.gif">
    </head>
    <body>

            <div id="header-container"></div>

                    style="display: flex; flex-direction: column; gap: 20px; width: 100%; min-width: 0;">

                                <button aria-label="Minimize"></button>
                                <button aria-label="Maximize"></button>
                                <button aria-label="Close"></button>
                            </div>
                        </div>
                        <div class="window-body">
                            <h2 class="highlight-blue">Azo's Fanart
                                Gallery!</h2>
                            <p>~ Wonderful fanarts and
                                sketches of my OC!</p>

                            <div class="gallery-section">
                                <div class="gallery-grid"
                                    style="grid-template-columns: repeat(4, 1fr); gap: 15px;">
                                    <img src="images/gallery/azofanart15.png"
                                        data-full="images/gallery/azofanart15.png"
